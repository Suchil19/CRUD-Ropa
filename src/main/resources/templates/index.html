<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido | eCommerce Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .stat-circle {
            width: 150px;
            height: 150px;
            border: 4px solid #fff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="container">
            <h1 class="display-2 fw-bold mb-3">Tech-Wear Solutions</h1>
            <p class="lead mb-5">Sistema de Gestión de Inventario Inteligente</p>

            <div class="row mb-5">
                <div class="col-md-6">
                    <div class="stat-circle shadow">
                        <h2 class="mb-0" th:text="${existencias}">0</h2>
                        <span class="small">Existencias</span>
                    </div>
                    <p>Unidades físicas en bodega</p>
                </div>
                <div class="col-md-6">
                    <div class="stat-circle shadow">
                        <h2 class="mb-0" th:text="${tipos}">0</h2>
                        <span class="small">Modelos</span>
                    </div>
                    <p>Diseños únicos registrados</p>
                </div>
            </div>

            <a href="/ropa" class="btn btn-primary btn-lg px-5 py-3 shadow">
                Gestionar Inventario <i class="bi bi-arrow-right"></i>
            </a>
        </div>
    </section>

</body>
</html>
